name: AdimPlus 1.5 Test APK
on:
  workflow_dispatch:
  push:
    branches: [ adimsayar-android-test ]
    paths-ignore:
      - 'downloads/**'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon assembleDebug
      - name: Preserve APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdimPlus-v1.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct APK link
        continue-on-error: true
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/AdimPlus-v1.5.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AdimPlus-v1.5.apk
          git commit -m "build: test pedometer APK [skip ci]" || true
          git push origin HEAD:adimsayar-android-test
